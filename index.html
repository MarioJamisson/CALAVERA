<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calavera - Organizador financeiro brutalista e minimalista radical de alta performance para controle de gastos e projeções futuras.">
  <title>Calavera | Controle Financeiro Brutalista</title>
  
  <!-- Estilos e Fontes -->
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Preconnect para fontes rápidas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  
  <div class="app-container">
    <!-- Cabeçalho Principal -->
    <header class="app-header">
      <a href="#" class="app-logo" id="logo-link">
        CALAV<span class="logo-highlight">ERA</span>
      </a>
      
      <div class="header-controls">
        <!-- Botão Tutorial -->
        <button id="tutorial-btn" class="btn-brutal btn-sm" aria-label="Abrir Tutorial Guiado">
          Tutorial
        </button>
        <!-- Alternador de Tema -->
        <button id="theme-toggle" class="btn-brutal btn-sm" aria-label="Alternar Tema Claro/Escuro">
          Modo Claro
        </button>
        <!-- Botão Novo Lançamento Rápido -->
        <button id="add-transaction-btn" class="btn-brutal btn-primary btn-sm" aria-label="Adicionar Nova Transação">
          + Lançar
        </button>
      </div>
    </header>

    <!-- Navegação de Abas -->
    <nav class="app-nav" aria-label="Navegação Principal">
      <button class="nav-tab active" id="tab-dashboard" data-tab="dashboard">
        Dashboard
      </button>
      <button class="nav-tab" id="tab-timeline" data-tab="timeline">
        Extrato & Linha do Tempo
      </button>
      <button class="nav-tab" id="tab-projections" data-tab="projections">
        Projeções Futuras
      </button>
      <button class="nav-tab" id="tab-card-projections" data-tab="card-projections">
        Projeções no Cartão
      </button>
      <button class="nav-tab" id="tab-analysis" data-tab="analysis">
        Análise Financeira
      </button>
    </nav>

    <!-- Conteúdo Principal Dinâmico (SPA Mount) -->
    <main id="app-viewport">
      <!-- Injetado Dinamicamente via Componentes -->
    </main>

    <!-- Rodapé de Ações do Sistema -->
    <footer class="app-footer">
      <span class="footer-title">CALAVERA v1.0.0</span>
      <div class="backup-controls">
        <button id="export-backup-btn" class="btn-brutal btn-sm btn-outline" title="Exportar dados como JSON">
          💾 Exportar Backup
        </button>
        <button id="import-backup-btn" class="btn-brutal btn-sm btn-outline" title="Importar dados de um arquivo JSON">
          📂 Importar Backup
        </button>
        <input type="file" id="import-backup-file" accept=".json" style="display: none;">
      </div>
    </footer>
  </div>

  <!-- Botão Flutuante de Acesso Rápido -->
  <button id="fab-add" class="fab-btn" title="Adicionar Transação" aria-label="Adicionar Transação Rápida">+</button>

  <!-- Modal de Lançamentos -->
  <div class="modal-overlay" id="add-transaction-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <!-- Injetado dinamicamente via TransactionModal.js -->
  </div>

  <!-- Ponto de Entrada da Lógica JavaScript -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
